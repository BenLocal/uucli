# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "gen-vectors"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Writes uucli golden test vectors from upstream uu-remote-linux v0.2.59 source"

# Same major versions as upstream v0.2.59 Cargo.toml.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
log = "0.4"
rand = "0.8"
flate2 = "1.0"

[workspace]
